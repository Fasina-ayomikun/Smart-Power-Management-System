<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Ravabot - Power Management System</title>
  </head>
  <body>
    <section class="login-section flex">
      <form id="loginForm" class="flex">
        <img src="./rav.png" alt="Ravabot" class="login-logo" />
        <input
          type="text"
          id="username"
          class="input"
          placeholder="Enter username"
          required
        />
        <input
          type="password"
          id="password"
          class="input"
          placeholder="Enter password"
          required
        />
        <button type="submit">Login</button>
      </form>
    </section>
    <script type="module" src="app.js"></script>
  </body>
</html>
